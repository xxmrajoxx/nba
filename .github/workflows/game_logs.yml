name: Fetch NBA Team Game Logs (Weekly)

on:
  workflow_dispatch: {}
  schedule:
    # Sunday 9:00am Sydney time
    # = Saturday 23:00 UTC (AEST)
    - cron: "0 23 * * 6"

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NBA game logs script
        run: |
          python src/team_game_logs/game_logs.py

      - name: Commit generated CSV (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/team_game_logs/*.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly update: team game logs"
            git push
          fi
