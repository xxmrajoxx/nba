name: Weekly Sentence Generator

on:
  workflow_dispatch: {}
  schedule:
    # Runs every Sunday at 9:00am Sydney time (AEST) = Saturday 23:00 UTC
    - cron: "0 23 * * 6"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        run: |
          python scripts/generate_message.py

      - name: Commit output (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/message.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update message.txt"
            git push
          fi
